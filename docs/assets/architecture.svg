<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-label="How DeepInfer-Mac streams experts from the SSD, and where time and memory go">
<title>How DeepInfer-Mac streams experts from the SSD, and where time and memory go</title>
<style>
  .card { fill: #fcfcfb; stroke: #e4e3df; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #7a7974; }
  .ram { fill: #2a78d6; } .read { fill: #eb6834; } .spec { fill: #1baf7a; } .disk { fill: #dcdad3; } .attn { fill: #b9b7af; }
  .gpu { fill: #e9f1fc; stroke: #2a78d6; } .ssdbox { fill: #fdf0ea; stroke: #eb6834; }
  .box { fill: #ffffff; stroke: #c9c7bf; } .wire { stroke: #8a8984; } .ah { fill: #8a8984; }
  .wire-read { stroke: #eb6834; } .ah-read { fill: #eb6834; } .wire-spec { stroke: #1baf7a; } .ah-spec { fill: #1baf7a; }
  .accent { fill: #1c5cab; } .accent2 { fill: #c4501f; } .accent3 { fill: #11805a; }
  .grid { stroke: #e4e3df; } .axis { stroke: #8a8984; }
  .l-ov { stroke: #2a78d6; } .l-iw { stroke: #1baf7a; } .d-ov { fill: #2a78d6; } .d-iw { fill: #1baf7a; }
  .ring { stroke: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #161b22; stroke: #30363d; }
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #94938c; }
    .ram { fill: #3987e5; } .read { fill: #d95926; } .spec { fill: #199e70; } .disk { fill: #3a3a37; } .attn { fill: #5b5a55; }
    .gpu { fill: #14243a; stroke: #3987e5; } .ssdbox { fill: #2e1c14; stroke: #d95926; }
    .box { fill: #0d1117; stroke: #484f58; } .wire { stroke: #8b949e; } .ah { fill: #8b949e; }
    .wire-read { stroke: #e0703f; } .ah-read { fill: #e0703f; } .wire-spec { stroke: #2bbd88; } .ah-spec { fill: #2bbd88; }
    .accent { fill: #86b6ef; } .accent2 { fill: #f08a5d; } .accent3 { fill: #5fd3a6; }
    .grid { stroke: #30363d; } .axis { stroke: #8b949e; }
    .l-ov { stroke: #3987e5; } .l-iw { stroke: #2bbd88; } .d-ov { fill: #3987e5; } .d-iw { fill: #2bbd88; }
    .ring { stroke: #161b22; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Noto Sans Mono CJK SC', monospace; }
</style>
<rect class="card" x="0.5" y="0.5" width="1279" height="689" rx="16"/>
<text class="t1" x="48" y="60" font-size="28" font-weight="700">One layer of a decode step (×40 per token)</text>
<text class="t2" x="48" y="92" font-size="19">Dense weights stay in memory. Missing experts are read from the SSD; the next layer's likely experts follow them.</text>
<rect class="gpu" x="40" y="120" width="780" height="340" rx="14" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="accent" x="62" y="150" font-size="17" font-weight="700" letter-spacing="1">UNIFIED MEMORY · GPU</text>
<rect class="ssdbox" x="990" y="120" width="250" height="340" rx="14" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="accent2" x="1010" y="150" font-size="17" font-weight="700" letter-spacing="1">INTERNAL SSD</text>
<rect class="box" x="62" y="172" width="220" height="120" rx="10" stroke-width="1.5"/><text class="t1" x="172.0" y="206" font-size="21" font-weight="600" text-anchor="middle">Attention</text><text class="t2" x="172.0" y="234" font-size="17" text-anchor="middle">sparse attention,</text><text class="t2" x="172.0" y="259" font-size="17" text-anchor="middle">indexer, mHC</text>
<rect class="box" x="312" y="172" width="200" height="120" rx="10" stroke-width="1.5"/><text class="t1" x="412.0" y="206" font-size="21" font-weight="600" text-anchor="middle">Router</text><text class="t2" x="412.0" y="234" font-size="17" text-anchor="middle">6 of 384 experts</text><text class="t2" x="412.0" y="259" font-size="17" text-anchor="middle">+ next layer's guess</text>
<rect class="box" x="542" y="172" width="256" height="120" rx="10" stroke-width="1.5"/><text class="t1" x="670.0" y="206" font-size="21" font-weight="600" text-anchor="middle">Expert cache</text><text class="t2" x="670.0" y="234" font-size="17" text-anchor="middle">LRU slots in MLX slabs</text><text class="t2" x="670.0" y="259" font-size="17" text-anchor="middle">guesses enter cold</text>
<rect class="box" x="542" y="318" width="256" height="104" rx="10" stroke-width="1.5"/><text class="t1" x="670.0" y="352" font-size="21" font-weight="600" text-anchor="middle">gather_qmm</text><text class="t2" x="670.0" y="380" font-size="17" text-anchor="middle">all experts of the layer,</text><text class="t2" x="670.0" y="405" font-size="17" text-anchor="middle">one quantized matmul</text>
<rect class="box" x="1008" y="172" width="214" height="120" rx="10" stroke-width="1.5"/><text class="t1" x="1115.0" y="206" font-size="21" font-weight="600" text-anchor="middle">Routed experts</text><text class="t2" x="1115.0" y="234" font-size="17" text-anchor="middle">40 × 384, 2–4-bit</text><text class="t2" x="1115.0" y="259" font-size="17" text-anchor="middle">208 GB</text>
<rect class="box" x="1008" y="318" width="214" height="104" rx="10" stroke-width="1.5"/><text class="t1" x="1115.0" y="352" font-size="21" font-weight="600" text-anchor="middle">Engram tables</text><text class="t2" x="1115.0" y="380" font-size="17" text-anchor="middle">4-bit rows</text><text class="t2" x="1115.0" y="405" font-size="17" text-anchor="middle">114 GB</text>
<line class="wire" x1="282" y1="232" x2="310" y2="232" stroke-width="2.5"/><path class="ah" d="M310 232 l-11 -6 v12 z"/>
<line class="wire" x1="512" y1="232" x2="540" y2="232" stroke-width="2.5"/><path class="ah" d="M540 232 l-11 -6 v12 z"/>
<line class="wire" x1="670" y1="292" x2="670" y2="316" stroke-width="2.5"/><path class="ah" d="M670 316 l-6 -11 h12 z"/>
<line class="wire-read" x1="1006" y1="205" x2="800" y2="205" stroke-width="2.5"/><path class="ah-read" d="M800 205 l11 -6 v12 z"/>
<line class="wire-spec" x1="1006" y1="262" x2="800" y2="262" stroke-width="2.5"/><path class="ah-spec" d="M800 262 l11 -6 v12 z"/>
<text class="accent2" x="903" y="195" font-size="17" font-weight="600" text-anchor="middle">misses</text>
<text class="accent3" x="903" y="292" font-size="17" font-weight="600" text-anchor="middle">next layer's</text>
<text class="accent3" x="903" y="314" font-size="17" font-weight="600" text-anchor="middle">guesses, after</text>
<text class="accent3" x="903" y="336" font-size="17" font-weight="600" text-anchor="middle">misses land</text>
<line class="wire-read" x1="1115" y1="422" x2="1115" y2="444" stroke-width="2" stroke-dasharray="5 4"/><line class="wire-read" x1="1115" y1="444" x2="172" y2="444" stroke-width="2" stroke-dasharray="5 4"/><line class="wire-read" x1="172" y1="444" x2="172" y2="306" stroke-width="2" stroke-dasharray="5 4"/><path class="ah-read" d="M172 294 l-6 12 h12 z"/>
<text class="t2" x="330" y="434" font-size="16" text-anchor="middle">Engram rows (layers 1, 14)</text>
<text class="t1" x="48" y="520" font-size="21" font-weight="700">One token: 0.82 s (1.23 tok/s)</text>
<rect class="read" x="48" y="538" width="278.2818075299629" height="38" rx="4"/>
<rect class="ram" x="329.2818075299629" y="538" width="258.7181924700371" height="38" rx="4"/>
<text class="t2" x="48" y="606" font-size="17">SSD wait 0.42 s</text>
<text class="t2" x="588" y="606" font-size="17" text-anchor="end">compute 0.39 s</text>
<text class="t3" x="48" y="636" font-size="17">5.5 GB cache · per token 1.2 GB needed, 0.8 GB read ahead</text>
<text class="t1" x="680" y="520" font-size="21" font-weight="700">Where the 24 GB go</text>
<rect class="ram" x="680" y="538" width="171.79999999999998" height="38" rx="4"/>
<text class="t2" x="682" y="606" font-size="17">weights 7.6 GB</text>
<rect class="read" x="856.3" y="538" width="123.5" height="38" rx="4"/>
<text class="t2" x="856.8" y="606" font-size="17">cache 5.5 GB</text>
<rect class="disk" x="982.8" y="538" width="247.69999999999996" height="38" rx="4"/>
<text class="t2" x="983.3" y="606" font-size="17">macOS, apps, KV ≥9 GB</text>
<text class="t3" x="680" y="636" font-size="17">The cache sizes itself so that macOS keeps ≥ 9 GB.</text>
</svg>
