<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-label="How DeepInfer-Mac streams experts from the SSD, and where time and memory go">
<title>How DeepInfer-Mac streams experts from the SSD, and where time and memory go</title>
<style>
  .card { fill: #fcfcfb; stroke: #e4e3df; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #7a7974; }
  .ram { fill: #2a78d6; } .read { fill: #eb6834; } .disk { fill: #dcdad3; }
  .gpu { fill: #e9f1fc; stroke: #2a78d6; } .ssdbox { fill: #fdf0ea; stroke: #eb6834; }
  .box { fill: #ffffff; stroke: #c9c7bf; } .wire { stroke: #8a8984; } .ah { fill: #8a8984; }
  .wire-read { stroke: #eb6834; } .ah-read { fill: #eb6834; }
  .accent { fill: #1c5cab; } .accent2 { fill: #c4501f; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #161b22; stroke: #30363d; }
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #94938c; }
    .ram { fill: #3987e5; } .read { fill: #d95926; } .disk { fill: #3a3a37; }
    .gpu { fill: #14243a; stroke: #3987e5; } .ssdbox { fill: #2e1c14; stroke: #d95926; }
    .box { fill: #0d1117; stroke: #484f58; } .wire { stroke: #8b949e; } .ah { fill: #8b949e; }
    .wire-read { stroke: #e0703f; } .ah-read { fill: #e0703f; }
    .accent { fill: #86b6ef; } .accent2 { fill: #f08a5d; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Noto Sans Mono CJK SC', monospace; }
</style>
<rect class="card" x="0.5" y="0.5" width="1279" height="609" rx="16"/>
<text class="t1" x="48" y="58" font-size="22" font-weight="700">One token, one layer — ×40 layers per token</text>
<text class="t2" x="48" y="84" font-size="14">Dense weights live in memory; routed experts are read from the SSD only when the router asks for one that is not cached.</text>
<rect class="gpu" x="40" y="110" width="790" height="330" rx="14" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="accent" x="60" y="136" font-size="13" font-weight="700" letter-spacing="1">UNIFIED MEMORY · GPU</text>
<rect class="ssdbox" x="980" y="110" width="260" height="330" rx="14" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="accent2" x="1000" y="136" font-size="13" font-weight="700" letter-spacing="1">INTERNAL SSD</text>
<rect class="box" x="64" y="160" width="220" height="110" rx="10" stroke-width="1.5"/><text class="t1" x="174.0" y="190" font-size="16" font-weight="600" text-anchor="middle">Attention</text><text class="t2" x="174.0" y="214" font-size="13" text-anchor="middle">compressed sparse attention</text><text class="t2" x="174.0" y="233" font-size="13" text-anchor="middle">+ indexer, mHC, Engram</text><text class="t2" x="174.0" y="252" font-size="13" text-anchor="middle">mxfp8, bit-exact</text>
<rect class="box" x="320" y="160" width="200" height="110" rx="10" stroke-width="1.5"/><text class="t1" x="420.0" y="190" font-size="16" font-weight="600" text-anchor="middle">Router</text><text class="t2" x="420.0" y="214" font-size="13" text-anchor="middle">picks 6 of 384 experts</text><text class="t2" x="420.0" y="233" font-size="13" text-anchor="middle">+ shared expert</text><text class="t2" x="420.0" y="252" font-size="13" text-anchor="middle">(resident)</text>
<rect class="box" x="556" y="160" width="250" height="110" rx="10" stroke-width="1.5"/><text class="t1" x="681.0" y="190" font-size="16" font-weight="600" text-anchor="middle">Expert cache</text><text class="t2" x="681.0" y="214" font-size="13" text-anchor="middle">LRU over slots in</text><text class="t2" x="681.0" y="233" font-size="13" text-anchor="middle">preallocated MLX slabs</text><text class="t2" x="681.0" y="252" font-size="13" text-anchor="middle">~49% hit rate</text>
<rect class="box" x="556" y="300" width="250" height="90" rx="10" stroke-width="1.5"/><text class="t1" x="681.0" y="330" font-size="16" font-weight="600" text-anchor="middle">gather_qmm</text><text class="t2" x="681.0" y="354" font-size="13" text-anchor="middle">all 6 experts, one fused</text><text class="t2" x="681.0" y="373" font-size="13" text-anchor="middle">quantized matmul per projection</text>
<rect class="box" x="1000" y="160" width="220" height="110" rx="10" stroke-width="1.5"/><text class="t1" x="1110.0" y="190" font-size="16" font-weight="600" text-anchor="middle">Routed experts</text><text class="t2" x="1110.0" y="214" font-size="13" text-anchor="middle">40 × 384, 2/3/4-bit</text><text class="t2" x="1110.0" y="233" font-size="13" text-anchor="middle">213 GB, page-aligned</text>
<rect class="box" x="1000" y="290" width="220" height="100" rx="10" stroke-width="1.5"/><text class="t1" x="1110.0" y="320" font-size="16" font-weight="600" text-anchor="middle">Engram tables</text><text class="t2" x="1110.0" y="344" font-size="13" text-anchor="middle">2 × 384M rows, 4-bit</text><text class="t2" x="1110.0" y="363" font-size="13" text-anchor="middle">115 GB, row cache</text>
<line class="wire" x1="284" y1="215" x2="318" y2="215" stroke-width="2"/><path class="ah" d="M318 215 l-9 -5 v10 z"/>
<line class="wire" x1="520" y1="215" x2="554" y2="215" stroke-width="2"/><path class="ah" d="M554 215 l-9 -5 v10 z"/>
<line class="wire" x1="681" y1="270" x2="681" y2="298" stroke-width="2"/><path class="ah" d="M681 298 l-5 -9 h10 z"/>
<line class="wire-read" x1="998" y1="215" x2="808" y2="215" stroke-width="2"/><path class="ah-read" d="M808 215 l5 9 h-10 z"/>
<text class="accent2" x="903" y="203" font-size="13" font-weight="600" text-anchor="middle">on a miss</text>
<text class="t2" x="903" y="240" font-size="12" text-anchor="middle">one preadv into a slab</text>
<text class="t3" x="903" y="256" font-size="12" text-anchor="middle">F_NOCACHE, zero-copy</text>
<line class="wire-read" x1="1110" y1="390" x2="1110" y2="418" stroke-width="2" stroke-dasharray="4 4"/><line class="wire-read" x1="1110" y1="418" x2="174" y2="418" stroke-width="2" stroke-dasharray="4 4"/><line class="wire-read" x1="174" y1="418" x2="174" y2="282" stroke-width="2" stroke-dasharray="4 4"/><path class="ah-read" d="M174 272 l-5 10 h10 z"/><text class="t2" x="380" y="408" font-size="12" text-anchor="middle">Engram n-gram rows (layers 1, 14)</text>
<text class="t1" x="48" y="484" font-size="16" font-weight="700">Where a token's 0.80 s goes</text>
<rect class="read" x="48" y="502" width="356.5" height="34" rx="4"/>
<rect class="ram" x="406.5" y="502" width="161.5" height="34" rx="4"/>
<text class="t2" x="48" y="560" font-size="13">SSD wait 0.55 s · ~1.8 GB at ~3 GB/s</text>
<text class="t2" x="568" y="560" font-size="13" text-anchor="end">GPU compute 0.25 s</text>
<text class="t3" x="48" y="586" font-size="13">→ decode is bound by SSD bandwidth: a bigger expert cache is the main lever.</text>
<text class="t1" x="680" y="484" font-size="16" font-weight="700">Where the 24 GB go</text>
<rect class="ram" x="680" y="502" width="191.20000000000002" height="34" rx="4"/>
<text class="t2" x="682" y="560" font-size="13">dense + head 8.4 GB</text>
<rect class="read" x="874.2" y="502" width="149.79999999999998" height="34" rx="4"/>
<text class="t2" x="875.2" y="560" font-size="13">expert cache ≤6.6 GB</text>
<rect class="disk" x="1026.0" y="502" width="205.0" height="34" rx="4"/>
<text class="t2" x="1027.0" y="560" font-size="13">macOS + apps ≥9 GB</text>
<text class="t3" x="680" y="586" font-size="13">The cache sizes itself from free memory at start-up; KV is ~1 KB per token.</text>
</svg>
