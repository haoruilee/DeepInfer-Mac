<rect x="0.5" y="0.5" width="1279" height="565" rx="14" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 14.5a14 14 0 0 1 14-14h1251a14 14 0 0 1 14 14v31h-1279z" fill="#161b22"/>
<circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
<text x="640.0" y="29" font-size="18" fill="#8b949e" text-anchor="middle">MacBook Air M4 · 24 GB — DeepSeek-V4.1-Flash, greedy</text>
<text class="mono" x="40" y="104" font-size="20" fill="#8b949e">$ <tspan fill="#e6edf3">python -m deepinfer_mac chat</tspan></text>
<text class="mono" x="40" y="148" font-size="20" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">you&gt; </tspan><tspan fill="#e6edf3">用一句话介绍一下杭州。</tspan></text>
<text class="mono" x="40" y="184" font-size="20" xml:space="preserve"><tspan fill="#ffa657" font-weight="700">ds&gt;  </tspan><tspan fill="#c9d1d9">杭州是中国浙江省的省会，以西湖美景、深厚的历史文化底蕴和蓬勃发展的数字经济而闻名。</tspan></text>
<text class="mono" x="40" y="220" font-size="20" xml:space="preserve"><tspan fill="#7d8590" xml:space="preserve">     [decode 1.23 tok/s]</tspan></text>
<text class="mono" x="40" y="256" font-size="20" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">you&gt; </tspan><tspan fill="#e6edf3">What is 17 * 23? Answer with the number only.</tspan></text>
<text class="mono" x="40" y="292" font-size="20" xml:space="preserve"><tspan fill="#ffa657" font-weight="700">ds&gt;  </tspan><tspan fill="#c9d1d9">391</tspan></text>
<text class="mono" x="40" y="328" font-size="20" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">you&gt; </tspan><tspan fill="#e6edf3">Write a haiku about the sea.</tspan></text>
<text class="mono" x="40" y="364" font-size="20" xml:space="preserve"><tspan fill="#ffa657" font-weight="700">ds&gt;  </tspan><tspan fill="#c9d1d9">Waves crash on the shore,</tspan></text>
<text class="mono" x="40" y="400" font-size="20" xml:space="preserve"><tspan fill="#c9d1d9" xml:space="preserve">     Salt and endless blue expanse,</tspan></text>
<text class="mono" x="40" y="436" font-size="20" xml:space="preserve"><tspan fill="#c9d1d9" xml:space="preserve">     Moon pulls the tide home.</tspan></text>
<text class="mono" x="40" y="472" font-size="20" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">you&gt; </tspan><tspan fill="#e6edf3">/img carrots.jpeg What is in this image? One sentence.</tspan></text>
<text class="mono" x="40" y="508" font-size="20" xml:space="preserve"><tspan fill="#ffa657" font-weight="700">ds&gt;  </tspan><tspan fill="#c9d1d9">A small pile of four fresh orange carrots with green stems rests on a white background.</tspan></text>
</svg>
