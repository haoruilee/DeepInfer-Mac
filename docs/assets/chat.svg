<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="566" viewBox="0 0 1280 566" role="img" aria-label="Real chat output of DeepInfer-Mac on a MacBook Air M4 with 24 GB">
<title>Real chat output of DeepInfer-Mac on a MacBook Air M4 with 24 GB</title>
<style>
  .card { fill: #fcfcfb; stroke: #e4e3df; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #7a7974; }
  .ram { fill: #2a78d6; } .read { fill: #eb6834; } .spec { fill: #1baf7a; } .disk { fill: #dcdad3; } .attn { fill: #b9b7af; }
